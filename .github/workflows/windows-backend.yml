name: Windows backend verification

on:
  push:
    branches:
      - fix/subagent-catalog-memory
    paths:
      - .github/workflows/windows-backend.yml
      - patches/catalog-last-assistant.patch
  workflow_dispatch:
    inputs:
      run_baseline:
        description: Also rerun the unchanged source baseline
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zcode-backend-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: ${{ fromJSON(inputs.run_baseline && '["baseline","catalog-patch"]' || '["catalog-patch"]') }}
    env:
      ZCODE_ENV: production
      HUSKY: "0"
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=8192
      SOURCE_SHA: fec975905a2abd4c07e35c40d51fa097a2258ec9
    steps:
      - name: Use repository LF endings on this temporary runner
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout control repository
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false

      - name: Checkout pinned public source
        uses: actions/checkout@v4
        with:
          repository: zai-org/ZCode
          ref: fec975905a2abd4c07e35c40d51fa097a2258ec9
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify baseline identity
        shell: pwsh
        working-directory: source
        run: |
          if ((git rev-parse HEAD) -ne $env:SOURCE_SHA) { throw 'Source SHA mismatch' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne '3.18.2') { throw "Unexpected version: $version" }
          node scripts/check-workspace-freshness.mjs --no-fetch --max-behind-main 2147483647
          if ($LASTEXITCODE -ne 0) { throw 'Baseline freshness check failed' }

      - name: Apply catalog patch
        if: matrix.variant == 'catalog-patch'
        shell: pwsh
        working-directory: source
        run: |
          git apply --check ../control/patches/catalog-last-assistant.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch does not apply cleanly' }
          git apply ../control/patches/catalog-last-assistant.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch application failed' }

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Install dependencies on runner only
        shell: pwsh
        working-directory: source
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }

      - name: Build backend dependencies without rebuilding plugin executors
        id: dependencies
        shell: pwsh
        working-directory: source
        run: |
          pnpm --filter @zcode/model-option-map build
          if ($LASTEXITCODE -ne 0) { throw 'model-option-map build failed' }
          pnpm --filter @zcode/session-control build
          if ($LASTEXITCODE -ne 0) { throw 'session-control build failed' }
          pnpm exec tsc -b packages/shared
          if ($LASTEXITCODE -ne 0) { throw 'shared build failed' }
          foreach ($package in @('@zcode/provider', '@zcode/provider-node', '@zcode/shared-types', '@zcode/contracts', '@zcode/dynamic-workflow', '@zcode/dynamic-workflow-runtime', '@zcode/core', '@zcode/adapters', '@zcode/i18n', '@zcode/telemetry', '@zcode/bootstrap', '@zcode/tui')) {
            pnpm --filter $package build
            if ($LASTEXITCODE -ne 0) { throw "Dependency build failed: $package" }
          }

      - name: Run required gates and focused regressions
        shell: pwsh
        working-directory: source
        run: |
          $env:PATH = "$(Join-Path $PWD 'node_modules/.bin');$env:PATH"
          $results = [System.Collections.Generic.List[object]]::new()
          function Check([string]$name, [string[]]$arguments) {
            Write-Host "::group::$name"
            & pnpm @arguments
            $code = $LASTEXITCODE
            $results.Add([pscustomobject]@{ name = $name; exitCode = $code })
            Write-Host '::endgroup::'
          }
          Check 'root typecheck' @('typecheck')
          Check 'root lint' @('lint')
          Check 'CLI typecheck' @('--dir', 'apps/zcode-cli', 'typecheck')
          foreach ($package in @('@zcode/contracts', '@zcode/core', '@zcode/adapters', '@zcode/bootstrap', '@zcode/cli')) {
            Check "$package typecheck" @('--filter', $package, 'typecheck')
          }
          Check 'CLI lint' @('--dir', 'apps/zcode-cli', 'lint')
          Check 'format' @('fmt:check')
          Check 'architecture' @('architecture:check', '--', '--changed')
          Check 'storage regressions' @('--filter', '@zcode/adapters', 'exec', 'vitest', 'run', 'tests/session-store.test.ts')
          Check 'catalog regressions' @('--filter', '@zcode/bootstrap', 'exec', 'vitest', 'run', 'tests/subagent-session-query.test.ts', 'tests/v4-detached-child-hydration.test.ts', 'tests/session-event-store-retention.protocol.test.ts')
          Check 'event store regressions' @('--filter', '@zcode/contracts', 'exec', 'vitest', 'run', 'tests/in-memory-session-event-store.test.ts')
          Check 'runtime regressions' @('--filter', '@zcode/core', 'exec', 'vitest', 'run', 'tests/runtime-session-residency.test.ts', 'tests/runtime-compact.test.ts', 'tests/runtime-persistence.test.ts', 'tests/runtime-tool-loop.test.ts', 'tests/tool-executor-trace.test.ts')
          Check 'CLI observation regression' @('--filter', '@zcode/cli', 'exec', 'node', '--import', 'tsx', '--test', 'tests/tui-subagent-observation.test.ts')
          $results | ConvertTo-Json | Set-Content -Encoding utf8 ../checks-${{ matrix.variant }}.json
          if ($results.Where({ $_.exitCode -ne 0 }).Count -gt 0) { throw 'One or more verification gates failed; see checks report and logs' }

      - name: Build experimental backend even when unrelated baseline gates fail
        id: backend
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: pwsh
        working-directory: source
        run: |
          pnpm --filter @zcode/cli build:desktop-agent
          if ($LASTEXITCODE -ne 0) { throw 'Backend build failed' }

      - name: Mark artifact as incompatible pending official CUA verification
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        shell: pwsh
        run: |
          $bundle = 'source/apps/zcode-cli/packages/cli/dist/zcode.cjs'
          $manifest = [ordered]@{
            sourceCommit = $env:SOURCE_SHA
            variant = '${{ matrix.variant }}'
            backendSha256 = (Get-FileHash $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
            deploymentReady = $false
            officialComponentCompatibilityVerified = $false
            warning = 'Public frame-contract implementation is a placeholder. Do not replace an official installation with this artifact.'
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 backend-manifest-${{ matrix.variant }}.json

      - name: Save reports and experimental backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-backend-${{ matrix.variant }}-NOT-FOR-INSTALL
          retention-days: 3
          if-no-files-found: warn
          path: |
            checks-${{ matrix.variant }}.json
            backend-manifest-${{ matrix.variant }}.json
            source/apps/zcode-cli/packages/cli/dist/zcode.cjs
            source/apps/zcode-cli/packages/cli/dist/provider/**
            source/apps/zcode-cli/packages/cli/dist/*NOTICE*
            source/apps/zcode-cli/packages/cli/dist/*LICENSE*
